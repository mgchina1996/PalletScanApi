services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    volumes:
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "80"
    networks:
      backend:
      proxy:
        aliases:
          - pallet-scan-api
    volumes:
      - app-storage:/var/www/html/storage:ro

volumes:
  app-storage:

networks:
  backend:
    internal: true
  proxy:
    external: true
    name: "${NPM_NETWORK:-nginx-proxy-manager_default}"
